name: Build release APK (fork)

# Fork-only helper: builds an unsigned-for-store release APK (signed with the
# checked-in android.jks) from any ref and uploads it as an artifact.
# It does NOT create a GitHub Release or publish anywhere.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build'
        type: string
        required: true
        default: 'support-line-26.14.0'

jobs:
  build:
    name: Build release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set environments
        run: |
          {
            echo "versionName=v$(grep versionName app/build.gradle | awk '{print $2}' | tr -d \")"
            echo "LINE_versionCode=$(grep HOOK_TARGET_VERSION app/build.gradle | awk '{print $4}' | tr -d \'\")"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> $GITHUB_ENV

      - name: Set LINE versionName
        run: |
          LINE_versionCode="${{ env.LINE_versionCode }}"
          major="${LINE_versionCode:0:2}"
          minor="${LINE_versionCode:2:2}"
          patch="${LINE_versionCode:4:1}"
          if (( ${minor} < 10 )); then
              minor="${LINE_versionCode:2:1}"
          fi
          echo "LINE_versionName=$(echo ${major}.${minor}.${patch})" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --stacktrace --warning-mode=all assembleRelease
          cp -f app/build/outputs/apk/release/app-release.apk "LIME-release-lineTarget${{ env.LINE_versionName }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LIME-release-${{ env.versionName }}-lineTarget${{ env.LINE_versionName }}@${{ env.commit }}
          path: LIME-release-lineTarget${{ env.LINE_versionName }}.apk
          if-no-files-found: error
